<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍁 Soundboard do Caos 🍁</title>
<link rel="stylesheet" href="painel.css">
</head>
<body>
<header class="top">
</header>

<div class="status-row">
  <div id="status" class="status offline">🔴 Offline</div>
</div>

<section id="info" class="info open">
  <p class="development-notice">🌿 Vai com calma, ainda está em desenvolvimento.</p>

</section>


<div class="random-row">
  <button id="randomButton" class="random-button">🎲 RANDOM — MANDE O CAOS</button>
</div>





<main id="grid"></main>

<div id="siteStats" class="site-stats" aria-live="polite">
  <span>👀 <strong id="totalVisits">—</strong> visitas</span>
  <span>🟢 <strong id="onlineNow">—</strong> online</span>
  <span>🏆 <strong id="peakOnline">—</strong> recorde</span>
</div>

<script src="supabase.min.js"></script>
<script src="config.js"></script>
<script src="painel.js"></script>
</body>
</html>
