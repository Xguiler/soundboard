<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍁 Soundboard do Caos 🍁</title>
<link rel="stylesheet" href="painel.css">
</head>
<body>
<header class="top">
</header>

<div class="status-row">
  <div id="status" class="status offline">🔴 Offline</div>
</div>

<section id="info" class="info open">
  <p class="development-notice">🌿 Vai com calma, ainda está em desenvolvimento.</p>
  <section id="lvlupMeter" class="lvlup-meter" aria-live="polite">
  <div class="lvlup-meter-head">
    <span id="lvlupTimer">⏱️ ∞</span>
  </div>
  <div id="lvlupRoundTimer" class="lvlup-round-timer">Rodada coletiva: aguardando primeiro crédito</div>
  <div class="lvlup-progress-wrap">
    <div class="lvlup-progress-track" role="progressbar" aria-label="Progresso da rodada até APOCALIPSE" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0">
      <div id="lvlupProgressFill" class="lvlup-progress-fill"></div>
    </div>
    <div class="lvlup-markers" aria-hidden="true">
      <span class="marker marker-vip"><i></i><b>R$ 1</b><small>VIP</small></span>
      <span class="marker marker-elite"><i></i><b>R$ 5</b><small>ELITE</small></span>
      <span class="marker marker-furia"><i></i><b>R$ 20</b><small>FÚRIA</small></span>
      <span class="marker marker-apoc"><i></i><b>R$ 50</b><small>APOCALIPSE</small></span>
    </div>
  </div>
</section>
</section>


<div class="random-row">
  <button id="randomButton" class="random-button">🎲 RANDOM — MANDE O CAOS</button>
</div>





<main id="grid"></main>

<div id="siteStats" class="site-stats" aria-live="polite">
  <span>👀 <strong id="totalVisits">—</strong> visitas</span>
  <span>🟢 <strong id="onlineNow">—</strong> online</span>
  <span>🏆 <strong id="peakOnline">—</strong> recorde</span>
</div>

<script src="supabase.min.js"></script>
<script src="config.js"></script>
<script src="lvlup-meter.js"></script>
<script src="painel.js"></script>
</body>
</html>
